[project]
name = "entirius-django-deliverypoints"
version = "2.2.0"
description = "Delivery points for Entirius: pickup points and parcel lockers for checkout, imported and served per channel"
keywords = ["django", "delivery", "pickup-points", "shipping", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "pydantic>=2.0",
    "drf-spectacular>=0.27",
    "requests>=2.28.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy", "dj-database-url", "psycopg[binary]"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-deliverypoints/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-deliverypoints"
Changelog = "https://github.com/entirius/entirius-django-deliverypoints/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-deliverypoints/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_deliverypoints"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1 — constant Haversine SQL template, values passed as bind params
"src/django_deliverypoints/services/geo_service.py" = ["S611"]

[tool.ruff.lint.isort]
known-first-party = ["django_deliverypoints"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# django_pim: optional integration (channel sync; try/except ImportError no-op fallback)
DEP001 = ["django_pim"]
